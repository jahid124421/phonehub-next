# =============================================================================
# PhoneHub Daily Automation Workflow
# =============================================================================
# Runs daily at 06:00 UTC to keep data fresh automatically.
# Also triggers on push to main (to verify changes) and manual dispatch.
#
# What it does:
#   1. Fetches fresh tech news from RSS feeds
#   2. Validates and refreshes brand logos
#   3. Runs data quality audits
#   4. Commits any data changes back to the repo
#   5. Submits updated URLs to IndexNow for SEO
#   6. Verifies the build still passes
#   7. Deploys to Vercel if data changed
# =============================================================================

name: PhoneHub Daily Automation

on:
  schedule:
    - cron: '0 6 * * *'        # Daily at 06:00 UTC
  workflow_dispatch:            # Manual trigger from GitHub Actions UI
  push:
    branches: [main]            # Also run on push to verify nothing broke

env:
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://phonehub-next.vercel.app' }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || '' }}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Refresh Data & News
  # Fetches fresh data and commits any changes back to the repo.
  # ---------------------------------------------------------------------------
  refresh-data:
    name: Refresh Data & News
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      # Pull the latest code
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # Set up Node.js with npm caching for faster installs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install all dependencies (clean install from lockfile)
      - name: Install dependencies
        run: npm ci

      # Generate Prisma client (needed for data scripts that touch the DB)
      - name: Generate Prisma client
        run: npm run db:generate
        continue-on-error: true

      # Fetch fresh tech news from RSS feeds and APIs
      - name: Fetch fresh tech news
        run: npm run fetch:news
        continue-on-error: true

      # Validate and re-fetch brand logos that may be broken or missing
      - name: Validate brand logos
        run: npm run fetch:logos
        continue-on-error: true

      # Run the full data quality audit (products, specs, brands, etc.)
      - name: Run data quality checks
        run: npm run data:refresh
        continue-on-error: true

      # Fetch latest monitor deals/data
      - name: Fetch monitor data
        run: npm run fetch:monitors
        continue-on-error: true

      # Fetch latest router deals/data
      - name: Fetch router data
        run: npm run fetch:routers
        continue-on-error: true

      # Detect whether any data files were modified by the scripts above
      - name: Check for data changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain src/data/ public/img/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Data files were modified — will commit and deploy."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          fi

      # Auto-commit updated data back to the repo (triggers Vercel auto-deploy)
      - name: Commit updated data
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "PhoneHub Bot"
          git config user.email "bot@phonehub.com"
          git add src/data/ public/img/
          git commit -m "chore: daily data refresh $(date +%Y-%m-%d)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      # Submit updated URLs to IndexNow for faster search engine indexing
      - name: Submit URLs to IndexNow
        run: npm run indexnow
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # JOB 2: Build Verification
  # Ensures the project still builds after any data changes.
  # ---------------------------------------------------------------------------
  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: refresh-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Generate Prisma client before build
      - name: Generate Prisma client
        run: npm run db:generate
        continue-on-error: true

      # Run the production build to catch any compile/render errors
      - name: Build
        run: npm run build

